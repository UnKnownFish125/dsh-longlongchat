# The dsh-longlongchat bundle patch: registers the memory UI surface plugin
# (host half: /mem-api proxy to the local memory-server; client half: the
# "记忆" view tab in the conversation view ring) and the agent-plane memory
# plugin (recall, extraction, /memory) from the same package.
- insert:
    - id: longlongchat-memory-ui
      name: 'dsh-longlongchat'
    - id: longlongchat-agent
      name: 'dsh-longlongchat/agent'
